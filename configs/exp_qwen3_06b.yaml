# EXPERIMENTO 2A — qwen3_06b. NO es producción.
#
# Entrena sobre el SPLIT CONGELADO (frozen-split-v2), no sobre el corpus completo. Es
# obligatorio: los configs de producción apuntan a generator-combined-cot-sft-40185, que
# CONTIENE los ejemplos de Test A y Test B — entrenar con ellos invalidaría los dos tests.
#
# `val` sale del train del split, nunca de Test A: usar Test A como eval durante el
# entrenamiento sería seleccionar checkpoints sobre el test.
#
# Sin `repair_train`: la ablación corre pura (§4.5 — con targets de 2,2 líneas el bias TSD
# no tiene estructura que aportar en ese canal, y diluiría el Δ).
#
# Uso:  python -m src.experiments.train_tsd --config configs/exp_qwen3_06b.yaml --ablation --no-repair [--tsd --tree ast]

run_name: exp-qwen3-0.6b

model:
  name_or_path: Qwen/Qwen3-0.6B-Base
  trust_remote_code: false

data:
  train: ../nodex-code/datasets/frozen-split-v2/train.jsonl
  val:   ../nodex-code/datasets/frozen-split-v2/val.jsonl
  max_seq_length: 2048

train:
  output_dir: models/exp-qwen3-0.6b
  num_train_epochs: 3
  # batch 2 x accum 16 = batch EFECTIVO 32, el mismo que 8x4. Solo cambia cuánta memoria
  # se usa por paso, no la dinámica de entrenamiento.
  #
  # Por qué: qwen3 tiene vocab 151.936, así que los logits a batch 8 x seq 2048 son 5 GB en
  # bf16 y cross_entropy los promociona a fp32 -> 10 GB más. Unos 15 GB solo para la
  # pérdida, y encima el experimento fuerza eager (sin el ahorro de flash attention). El
  # nano no lo sufre porque su vocab es 6.280: 24x menos.
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.1
  bf16: true
  gradient_checkpointing: true
  logging_steps: 20
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 500
  seed: 42
  report_to: none
