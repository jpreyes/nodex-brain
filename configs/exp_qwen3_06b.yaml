# EXPERIMENTO 2A — qwen3_06b. NO es producción.
#
# Entrena sobre el SPLIT CONGELADO (frozen-split-v2), no sobre el corpus completo. Es
# obligatorio: los configs de producción apuntan a generator-combined-cot-sft-40185, que
# CONTIENE los ejemplos de Test A y Test B — entrenar con ellos invalidaría los dos tests.
#
# `val` sale del train del split, nunca de Test A: usar Test A como eval durante el
# entrenamiento sería seleccionar checkpoints sobre el test.
#
# Sin `repair_train`: la ablación corre pura (§4.5 — con targets de 2,2 líneas el bias TSD
# no tiene estructura que aportar en ese canal, y diluiría el Δ).
#
# Uso:  python -m src.experiments.train_tsd --config configs/exp_qwen3_06b.yaml --ablation --no-repair [--tsd --tree ast]

run_name: exp-qwen3-0.6b

model:
  name_or_path: Qwen/Qwen3-0.6B-Base
  trust_remote_code: false

data:
  train: ../nodex-code/datasets/frozen-split-v2/train.jsonl
  val:   ../nodex-code/datasets/frozen-split-v2/val.jsonl
  max_seq_length: 2048

train:
  output_dir: models/exp-qwen3-0.6b
  num_train_epochs: 3
  # batch 8 x accum 4 = efectivo 32. NO bajar sin rehacer las 6 corridas de qwen3: el
  # micro-batching cambia el padding por batch y la acumulación, así que celdas con
  # distinto batch no son comparables entre sí aunque el efectivo coincida.
  #
  # Hubo un OOM en qwen3-tsd-s1337 y llegué a cambiarlo a 2x16. Era un diagnóstico
  # equivocado: la GPU la ocupaba un proceso huérfano de 24 GB (un python que sobrevivió
  # al kill del script padre). Con la tarjeta limpia, batch 8 entra — de hecho tres
  # corridas de qwen3 ya habían terminado así. Revertido para no invalidarlas.
  #
  # Contexto por si vuelve a apretar: el vocab de qwen3 son 151.936 tokens, así que los
  # logits a batch 8 x seq 2048 son 5 GB en bf16 y cross_entropy los promociona a fp32
  # (10 GB más). Es lo primero que se desborda si la GPU no está libre.
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.1
  bf16: true
  gradient_checkpointing: true
  logging_steps: 20
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 500
  seed: 42
  report_to: none
