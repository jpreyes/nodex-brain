# Base A del A/B — un ~12B instruct PERMISIVO (Apache/MIT).
#
# ⚠️ REEMPLAZA `name_or_path` por el mejor ~12B permisivo VIGENTE. No hardcodeamos
#    un modelo concreto porque el mercado cambia rápido; elige el actual (una
#    familia con licencia Apache/MIT ~12B instruct).
extends: _common.yaml

model:
  name_or_path: "REEMPLAZAR/12b-instruct-permisivo"   # ~12B Apache/MIT actual
  trust_remote_code: false
  attn_implementation: sdpa            # o flash_attention_2 si lo instalas

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
