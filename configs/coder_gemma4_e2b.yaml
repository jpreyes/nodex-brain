# ndx-coder-gemma4-e2b — Gemma 4 E2B (Google, ~efectivo 2B; Apache-2.0, UNGATED, sin login).
# Fine-tune sobre codegen 36k + repair-sft. Se entrena con src.train_tsd (sin --tsd = producción).
# E2B es grande: si no cabe full-FT en la GPU, usar QLoRA (src.train + config _common) en su lugar.

run_name: ndx-coder-gemma4-e2b

model:
  name_or_path: google/gemma-4-E2B-it
  trust_remote_code: false

quantization:
  load_in_4bit: true       # QLoRA — full-FT no cabe en 32GB (salida = adapter → merge en el export)

data:
  train: ../nodex-code/datasets/generator-combined-cot-sft-40185/train.jsonl
  val:   ../nodex-code/datasets/generator-combined-cot-sft-40185/val.jsonl
  repair_train: ../nodex-code/datasets/repair-sft/train.jsonl
  max_seq_length: 2048

train:
  output_dir: models/ndx-coder-gemma4-e2b
  num_train_epochs: 2
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.1
  bf16: true
  gradient_checkpointing: true
  logging_steps: 20
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 500
  seed: 42
  report_to: none
