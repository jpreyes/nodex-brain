# Defaults compartidos por todos los entrenamientos (SIN modelo base).
# Cadena de herencia:
#   runs (*_mistral.yaml / *_gemma.yaml)  →  base_*.yaml (modelo)  →  _common.yaml
# Mantener aquí lo que debe ser IDÉNTICO entre Mistral y Gemma para que
# la comparación A/B sea justa (LoRA + hiperparámetros de entrenamiento).

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  # "all-linear" → peft apunta a todas las capas lineales, robusto entre
  # arquitecturas distintas (Gemma 4 / Phi-4) sin depender de nombres de módulo.
  target_modules: all-linear

data:
  max_seq_length: 2048
  train_split: train.jsonl
  val_split: val.jsonl

train:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  optim: paged_adamw_8bit
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 200
  seed: 42
  report_to: none            # "wandb" / "tensorboard" para logging
