# Base: Gemma 3 (12B) — Gemma Terms of Use.
#
# NOTA: Gemma 3 es un repo "gated" en Hugging Face. Antes de descargarlo:
#   1) Acepta la licencia en https://huggingface.co/google/gemma-3-12b-it
#   2) Autentícate:  huggingface-cli login
extends: _common.yaml

model:
  name_or_path: google/gemma-3-12b-it   # 12B, Gemma Terms of Use
  trust_remote_code: false
  attn_implementation: eager            # recomendado para entrenar Gemma correctamente

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
