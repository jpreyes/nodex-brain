# EXPERIMENTO 2A — nano. NO es producción.
#
# Entrena sobre el SPLIT CONGELADO (frozen-split-v2), no sobre el corpus completo. Es
# obligatorio: los configs de producción apuntan a generator-combined-cot-sft-40185, que
# CONTIENE los ejemplos de Test A y Test B — entrenar con ellos invalidaría los dos tests.
#
# `val` sale del train del split, nunca de Test A: usar Test A como eval durante el
# entrenamiento sería seleccionar checkpoints sobre el test.
#
# Sin `repair_train`: la ablación corre pura (§4.5 — con targets de 2,2 líneas el bias TSD
# no tiene estructura que aportar en ese canal, y diluiría el Δ).
#
# Uso:  python -m src.experiments.train_tsd --config configs/exp_nano.yaml --ablation --no-repair [--tsd --tree ast]

run_name: exp-nano-215m

tokenizer: tokenizer/ndx

model:
  hidden_size: 1024
  intermediate_size: 2816
  num_hidden_layers: 16
  num_attention_heads: 16
  num_key_value_heads: 16
  max_position_embeddings: 2048
  rms_norm_eps: 1.0e-5
  rope_theta: 10000
  # attn_implementation lo decide el entrenador, no el config: producción (train_sft) usa
  # el default SDPA; el experimento (experiments/train_tsd) fuerza eager, que su máscara
  # aditiva 4D requiere. Fijarlo aquí obligaría a producción a pagar eager sin recibir bias.

data:
  train: ../nodex-code/datasets/frozen-split-v2/train.jsonl
  val:   ../nodex-code/datasets/frozen-split-v2/val.jsonl
  max_seq_length: 2048

train:
  output_dir: models/exp-nano-215m   # train_tsd le agrega -base / -tsd
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 8
  learning_rate: 3.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.1
  bf16: true
  gradient_checkpointing: true
  logging_steps: 20
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 500
  seed: 42
  report_to: none
