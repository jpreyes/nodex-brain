# NDX-Coder — modelo pequeño ENTRENADO DESDE CERO (init aleatorio).
# español → código NDX, con scratchpad <think>. Corre en CPU+RAM (GGUF) tras export.

run_name: ndx-coder-small

# Tokenizer propio (entrenado con src.tokenizer_train)
tokenizer: tokenizer/ndx

# Arquitectura (LlamaConfig desde cero: RoPE + RMSNorm + SwiGLU) ~215M params
model:
  hidden_size: 1024
  intermediate_size: 2816        # ~2.75x (SwiGLU)
  num_hidden_layers: 16
  num_attention_heads: 16
  num_key_value_heads: 16        # baja a 4 para GQA si quieres menos KV-cache
  max_position_embeddings: 2048
  rms_norm_eps: 1.0e-5
  rope_theta: 10000
  attn_implementation: sdpa
  # vocab_size se toma del tokenizer

data:
  train: ../nodex-code/datasets/generator-combined-cot-sft-40185/train.jsonl
  val:   ../nodex-code/datasets/generator-combined-cot-sft-40185/val.jsonl
  max_seq_length: 2048

train:
  output_dir: models/ndx-coder-small
  num_train_epochs: 3
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 4     # batch efectivo 64
  learning_rate: 3.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.1
  bf16: true
  gradient_checkpointing: false      # el modelo es chico; no hace falta
  packing: true                      # empaqueta secuencias para throughput
  logging_steps: 20
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 500
  seed: 42
  report_to: none                    # "wandb" / "tensorboard" para logging
