# Base: Mistral Nemo (12B) — Apache-2.0.
extends: _common.yaml

model:
  name_or_path: mistralai/Mistral-Nemo-Instruct-2407   # 12B, Apache-2.0
  trust_remote_code: false
  attn_implementation: sdpa      # "flash_attention_2" si tienes flash-attn instalado

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
