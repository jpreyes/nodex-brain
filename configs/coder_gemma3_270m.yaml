# NDX-Coder Gemma 3 270M (pretrained) para la ABLACIÓN TSD.
# Fine-tune completo sobre el dataset de codegen. Se entrena con src.train_tsd
# (con y sin --tsd). OJO: Gemma 3 270M es GATED (licencia Gemma, NO Apache) →
# `hf auth login` + aceptar en huggingface.co/google/gemma-3-270m. (Gemma 4 sí es Apache ungated.)

run_name: ndx-coder-gemma3-270m

model:
  name_or_path: google/gemma-3-270m
  trust_remote_code: false
  # attn_implementation lo fuerza train_tsd a "eager" (bias 4D de TSD)

data:
  train: ../nodex-code/datasets/generator-combined-cot-sft-40185/train.jsonl
  val:   ../nodex-code/datasets/generator-combined-cot-sft-40185/val.jsonl
  repair_train: ../nodex-code/datasets/repair-sft/train.jsonl   # producción; --no-repair para la ablación TSD
  max_seq_length: 2048

train:
  output_dir: models/ndx-coder-gemma3-270m   # train_tsd le agrega -base / -tsd
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4          # pretrained → LR más bajo que el from-scratch
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.1
  bf16: true
  gradient_checkpointing: true
  logging_steps: 20
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 500
  seed: 42
  report_to: none
