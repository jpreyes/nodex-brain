# Config de ejemplo: QLoRA para el dominio sísmico.

extends: base_model.yaml

run_name: nodex-seismic-qlora

data:
  dataset_dir: datasets/seismic-sft-1000
  train_split: train.jsonl
  val_split: val.jsonl
  max_seq_length: 2048

lora:
  r: 16
  alpha: 32

train:
  output_dir: adapters/seismic
  num_train_epochs: 3
  learning_rate: 2.0e-4
